name: 海王Box iOS 免费打包（未签名 IPA）

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # 诊断：确认工程文件是否完整上传（网页传文件最容易漏 xcodeproj 内部文件）
      - name: 诊断-列出工程文件
        run: |
          echo "===== 仓库根目录 ====="
          ls -la
          echo "===== xcodeproj 内部文件 ====="
          find "海王Box.xcodeproj" -type f 2>/dev/null || echo "!!! 没找到 海王Box.xcodeproj !!!"
          echo "===== 所有 swift 文件数量 ====="
          find . -name "*.swift" | wc -l

      # 诊断：列出 scheme，允许失败，不影响后续
      - name: 诊断-列出工程信息
        continue-on-error: true
        run: xcodebuild -list -project "海王Box.xcodeproj" 2>&1 || true

      # 编译：用 -target + -sdk，绕开中文 scheme 与 destination+archive 的坑
      - name: 编译 App（不签名）
        run: |
          xcodebuild \
            -project "海王Box.xcodeproj" \
            -target "海王Box" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      # 打包 IPA
      - name: 打包 IPA
        run: |
          echo "===== 编译产物 ====="
          find build -name "*.app" -type d 2>/dev/null || true
          APP=$(find build -name "海王Box.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "!!! 没找到 海王Box.app，编译未产出 App !!!"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry HaiWangBox.ipa Payload
          echo "===== IPA 已生成 ====="
          ls -lh build/HaiWangBox.ipa

      - name: 上传 IPA 成品
        uses: actions/upload-artifact@v4
        with:
          name: 海王Box-未签名IPA
          path: build/HaiWangBox.ipa
          if-no-files-found: error
          retention-days: 30
